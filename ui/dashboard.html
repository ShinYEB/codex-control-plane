    }
    @media (max-width: 380px) {
      .run-actions { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main class="app" data-visual-regression-widths="360 480 600 800 1000 1200">
    <header class="header">
      <div>
        <div class="eyebrow">Control plane</div>
        <h1>작업 목록</h1>
        <div class="subtitle" id="scope"></div>
      </div>
      <div class="toolbar">
        <button class="button" id="refresh">새로고침</button>
      </div>
    </header>

    <section class="runbar" id="runbar">
      <div class="run-main">
        <div class="run-label">선택한 작업</div>
        <div class="run-title-line"><div class="name" id="run-name">준비된 실행</div><span class="run-status-badge" id="run-status-badge">확인 중</span></div>
        <div class="focus-now"><div class="focus-now-label">지금 하는 일</div><div class="focus-now-value" id="focus-now">실행 정보를 불러오는 중입니다.</div></div>
        <div class="focus-result" id="focus-result"><strong>결과 요약</strong><p id="focus-result-summary"></p></div>
      </div>
      <div class="run-actions"><button class="button primary" id="open-inspector">구조 보기</button><button class="button danger" id="cancel-run">취소</button><button class="button" id="archive-run">보관</button></div>
    </section>

    <section class="notification-banner" id="notification-banner" aria-live="polite">
      <div><div class="notification-kind" id="notification-kind"></div><div class="notification-title" id="notification-title"></div><div class="notification-body" id="notification-body"></div></div>
    </section>

    <details class="secondary-section" id="history-drawer" open>
      <summary><span>전체 작업 <span id="history-count">0</span></span></summary>
      <section class="dispatch-board" id="dispatch-board">
        <div class="dispatch-board-head"><div class="dispatch-board-title">작업함</div></div>
        <label class="scope-filter">표시 범위<select id="archive-scope"><option value="active">활성</option><option value="archived">보관됨</option><option value="all">전체</option></select></label>
        <div class="run-lanes" id="run-lanes"><div class="meta">접수된 실행이 없습니다.</div></div>
      </section>
    </details>

    <details class="secondary-section" id="inspector" open>
      <summary><span>선택한 작업의 실행 구조</span></summary>
      <div class="inspector-body">
        <section class="metrics">
          <article class="metric"><div class="metric-label">전체</div><div class="metric-value" id="m-agents">—</div></article>
          <article class="metric"><div class="metric-label">진행 중</div><div class="metric-value" id="m-active">—</div></article>
          <article class="metric"><div class="metric-label">확인 필요</div><div class="metric-value" id="m-running">—</div></article>
          <article class="metric"><div class="metric-label">완료</div><div class="metric-value" id="m-completed">—</div></article>
        </section>
        <section class="panel">
          <div class="panel-head">
            <div class="tabs">
              <button data-tab="graph" class="tab active">구조</button>
              <button class="tab" data-tab="progress">작업</button>
              <button class="tab" data-tab="sessions">스레드</button>
              <button class="tab" data-tab="results">결과</button>
            </div>
            <div class="toolbar"><input class="search" id="search" placeholder="작업 또는 스레드 검색" /><button class="button" id="open-diagnostics" type="button">고급 진단</button></div>
          </div>
          <div class="list" id="list"><div class="empty">데이터 없음</div></div>
          <div class="footer"><span id="count">—</span><span id="updated">—</span></div>
        </section>
      </div>
    </details>
  </main>

  <dialog id="detail">
    <div class="detail-head"><strong id="detail-title">상세 정보</strong><button class="button" id="close">닫기</button></div>
    <div class="detail-body" id="detail-content"></div>
  </dialog>

  <dialog id="register-agent">
    <div class="detail-head"><strong>에이전트 프로필 편집</strong><button class="button" id="register-close" type="button">닫기</button></div>
    <form class="detail-body" id="register-form">
      <div class="form-grid">
        <div><div class="name" id="register-name">선택한 스레드</div><div class="meta" id="register-id"></div></div>
        <label class="field"><span>역할 *</span><input id="register-role" required placeholder="예: backend, reviewer, qa" /></label>
        <label class="field"><span>전문 역량</span><input id="register-capabilities" placeholder="예: api, database, testing (쉼표로 구분)" /></label>
        <label class="field"><span>맥락 요약</span><textarea id="register-summary" placeholder="이 스레드가 알고 있는 프로젝트 맥락과 잘하는 일을 적으세요."></textarea></label>
        <div class="form-help">Codex 스레드는 플러그인을 실행할 때 자동으로 등록됩니다. 여기서는 자동 배정에 사용할 역할과 맥락을 설정합니다.</div>
      </div>
      <div class="dialog-actions"><button class="button" id="register-cancel" type="button">취소</button><button class="button primary" id="register-submit" type="submit">프로필 저장</button></div>
    </form>
  </dialog>

  <dialog id="diagnostics">
    <div class="detail-head"><div><strong>고급 진단</strong><div class="meta">실행 계약, 내부 이벤트와 원시 상태</div></div><button class="button" id="diagnostics-close" type="button">닫기</button></div>
    <div class="detail-body advanced-body" id="diagnostics-content"></div>
  </dialog>

  <script>
    const pageParams = new URLSearchParams(location.search);
    const standalone = window.parent === window && pageParams.has("token");
    const openaiBridge = typeof window !== "undefined" ? window.openai : undefined;
    const state = { agents: [], tasks: [], plans: [], worktrees: [], roles: [], memories: [], notifications: [], events: [], turnDispatches: [], runThreads: [], runs: [], globalRuns: [], run: null, graph: null, threadBudget: null, contextSnapshotDetail: null, cwd: pageParams.get("cwd"), runId: pageParams.get("runId"), scope: pageParams.get("scope") || "active", revision: 0, dashboardLeaseToken: null, tab: "graph", query: "", updatedAt: null };
    const pending = new Map();
    let nextId = 1;
    let refreshFlight = null;
    let pollTimer = null;
    let eventStream = null;
    let unchangedPolls = 0;
    let pageActive = true;
    let lifecycleGeneration = 0;

    const el = (id) => document.getElementById(id);
    const normalize = (value) => String(value ?? "unknown").replace(/[^a-z]/gi, "").toLowerCase();
    const shortId = (value) => value ? value.slice(0, 8) : "—";
    const date = (value) => {
      if (!value) return "—";
      const raw = typeof value === "number" && value < 1e12 ? value * 1000 : value;
      const parsed = new Date(raw);
      return Number.isNaN(parsed.valueOf()) ? "—" : new Intl.DateTimeFormat(document.documentElement.lang || "ko", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }).format(parsed);
    };
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
    const statusLabels = {
      draft: "초안", accepted: "접수 완료", planning: "계획 수립 중", preparing: "에이전트 구성 중", agents_prepared: "에이전트 준비 완료", staged: "실행 준비",
      blocked: "선행 작업 대기", blocked_by_policy: "정책으로 차단", queued: "실행 대기", running: "작업 중",
      agent_done: "결과 제출됨", validating: "완료 기준 검증 중", integration_pending: "변경 통합 중", integration_blocked: "통합 충돌", upgrade_pending: "데몬 전환 대기", retry_waiting: "재시도 대기",
      waiting_for_lease: "작업 공간 대기", completed: "완료", rejected: "검증 반려",
      completed_with_warnings: "경고와 함께 완료", validation_failed: "검증 오류", failed: "실패", skipped: "조건 불충족으로 생략", interrupted: "중단", canceled: "취소", cancelled: "취소",
      leased: "작업 배정됨", idle: "대기", available: "사용 가능", pending: "대기"
    };
    const statusLabel = (value) => statusLabels[value] ?? value ?? "알 수 없음";
    const notificationLabels = { completed: "완료", failed: "실패", attention_required: "판단 필요", policy_blocked: "정책 중단" };
    const failureActionLabel = (value) => ({ retry: "일시 오류 재시도", rework: "피드백 기반 재작업", repair_contract: "실행 계약 수정 필요", manual_intervention: "사용자 확인", fail: "실패 종료", none: "추가 조치 없음" })[value] ?? value ?? "조치 확인 필요";
    const terminalStatuses = new Set(["completed", "completed_with_warnings", "rejected", "validation_failed", "failed", "skipped", "interrupted", "canceled", "cancelled", "blocked_by_policy", "integration_blocked"]);
    const isTerminalStatus = (status) => terminalStatuses.has(status);
    const threadLink = (threadId, label = "Codex 스레드 열기", { readOnly = false } = {}) => `<button type="button" class="button button-link open-agent" data-thread-id="${escapeHtml(threadId)}"${readOnly ? ' data-daemon-managed="true"' : ""} title="${readOnly ? "실행 중인 실제 Codex 스레드를 관찰용으로 엽니다. 명령 입력은 데몬이 관리합니다." : "실제 Codex 스레드를 엽니다"}">${label}</button>`;
    const dispatchStage = (status) => ({ accepted: 0, draft: 0, planning: 1, preparing: 2, agents_prepared: 2, running: 3, completed: 4, failed: 4, cancelled: 4, canceled: 4 })[status] ?? 0;
    const runStage = (status) => ["accepted", "draft", "planning", "preparing", "agents_prepared"].includes(status) ? 0 : ["running"].includes(status) ? 1 : ["completed"].includes(status) ? 3 : 2;

    function request(method, params) {
      const id = nextId++;
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
    }

    async function callTool(name, args = {}) {
      if (openaiBridge?.callTool) {
        const result = await openaiBridge.callTool(name, args);
        if (result?.isError) throw new Error(result.content?.[0]?.text || `${name} failed`);
        return result?.structuredContent ?? result ?? {};
      }
      const result = await request("tools/call", { name, arguments: args });
      if (result?.isError) throw new Error(result.content?.[0]?.text || `${name} failed`);
      return result?.structuredContent ?? {};
    }

    async function openAgentThread(threadId) {
      try {
        if (standalone) throw new Error("웹 대시보드에서는 Codex Desktop 직접 이동을 지원하지 않습니다.");
        if (!state.dashboardLeaseToken) throw new Error("대시보드 소유권이 없습니다. Control Plane에서 다시 여세요.");
        await callTool("open_desktop_thread", { threadId, dashboardLeaseToken: state.dashboardLeaseToken });
        el("updated").textContent = `Codex Desktop에서 작업을 열었습니다 · ${shortId(threadId)}`;
      } catch (error) {
        try {
          await navigator.clipboard.writeText(threadId);
          el("updated").textContent = `${error.message} 작업 ID를 복사했습니다 · ${shortId(threadId)}`;
        } catch {
          el("updated").textContent = `${error.message} · 작업 ID: ${threadId}`;
        }
      }
    }

    function bindAgentLinks() {
      [...document.querySelectorAll(".open-agent")].forEach((button) => button.addEventListener("click", async (event) => {
        event.stopPropagation();
        button.disabled = true;
        try { await openAgentThread(button.dataset.threadId); }
        finally { button.disabled = false; }
      }));
    }

    function applySnapshot(snapshot) {
      if (Array.isArray(snapshot.agents)) state.agents = snapshot.agents;
      if (snapshot.threadBudget) state.threadBudget = snapshot.threadBudget;
      if (Array.isArray(snapshot.tasks)) state.tasks = snapshot.tasks;
      if (Array.isArray(snapshot.plans)) state.plans = snapshot.plans;
      if (Array.isArray(snapshot.worktrees)) state.worktrees = snapshot.worktrees;
      if (Array.isArray(snapshot.roles)) state.roles = snapshot.roles;
      if (Array.isArray(snapshot.memories)) state.memories = snapshot.memories;
      if (Array.isArray(snapshot.notifications)) state.notifications = snapshot.notifications;
      if (Array.isArray(snapshot.events)) state.events = snapshot.events;
      if (Array.isArray(snapshot.turnDispatches)) state.turnDispatches = snapshot.turnDispatches;
      if (Array.isArray(snapshot.runThreads)) state.runThreads = snapshot.runThreads;
      if (Array.isArray(snapshot.runs)) state.runs = snapshot.runs;
      if (Array.isArray(snapshot.globalRuns)) state.globalRuns = snapshot.globalRuns;
      if (snapshot.graph !== undefined) state.graph = snapshot.graph;
      if (snapshot.run !== undefined) {
        if (state.run?.contextSnapshot?.id !== snapshot.run?.contextSnapshot?.id) state.contextSnapshotDetail = null;
        state.run = snapshot.run;
      }
      if (snapshot.cwd !== undefined) state.cwd = snapshot.cwd;
      if (snapshot.scope !== undefined) state.scope = snapshot.scope;
      if (snapshot.runId !== undefined) state.runId = snapshot.runId;
      if (snapshot.revision !== undefined) state.revision = snapshot.revision;
      if (snapshot.dashboardLeaseToken) state.dashboardLeaseToken = snapshot.dashboardLeaseToken;
      state.updatedAt = snapshot.generatedAt ?? new Date().toISOString();
      render();
    }

    function isTerminalView() {
      if (["completed", "failed", "cancelled", "canceled"].includes(state.run?.status)) return true;
      const terminal = new Set(["completed", "completed_with_warnings", "rejected", "failed", "interrupted", "canceled", "cancelled"]);
      return state.tasks.length > 0 && state.tasks.every((task) => terminal.has(task.status));
    }

    async function refresh() {
      if (refreshFlight) return refreshFlight;
      const button = el("refresh");
      const previousRevision = state.revision;
      button.disabled = true;
      refreshFlight = (async () => {
        try {
          if (standalone) {
            const response = await fetch(`/api/snapshot?${pageParams.toString()}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            applySnapshot(await response.json());
          } else {
            if (!state.dashboardLeaseToken) throw new Error("대시보드 소유권이 없습니다. Control Plane에서 다시 여세요.");
            const snapshot = await callTool("get_dashboard_state", {
              dashboardLeaseToken: state.dashboardLeaseToken,
              ...(state.cwd ? { cwd: state.cwd } : {}),
              ...(state.runId ? { runId: state.runId } : {}),
              scope: state.scope,
              ...(state.revision > 0 ? { sinceRevision: state.revision } : {}),
            });
            applySnapshot(snapshot);
          }
          return state.revision !== previousRevision;
        } catch (error) {
          el("updated").textContent = `갱신 실패: ${error.message}`;
          return false;
        } finally {
          button.disabled = false;
        }
      })().finally(() => { refreshFlight = null; });
      return refreshFlight;
    }

    function scheduleEmbeddedPoll() {
      clearTimeout(pollTimer);
      pollTimer = null;
      if (!pageActive || standalone || document.hidden || isTerminalView()) return;
      const generation = lifecycleGeneration;
      const delay = unchangedPolls === 0 ? 10_000 : unchangedPolls === 1 ? 30_000 : 60_000;
      pollTimer = setTimeout(async () => {
        const changed = await refresh();
        if (!pageActive || generation !== lifecycleGeneration) return;
        unchangedPolls = changed ? 0 : Math.min(2, unchangedPolls + 1);
        scheduleEmbeddedPoll();
      }, delay);
    }

    function connectEventStream() {
      eventStream?.close();
      eventStream = new EventSource(`/api/events?${pageParams.toString()}`);
      eventStream.addEventListener("update", (event) => {
        const payload = JSON.parse(event.data);
        const incoming = payload.delta ?? payload.snapshot ?? {};
        if (incoming.scope && incoming.scope !== state.scope) return;
        applySnapshot(incoming);
      });
      eventStream.onerror = () => { el("updated").textContent = "실시간 연결을 다시 시도하는 중…"; };
    }

    function filteredRows() {
      const rows = state.tab === "progress" ? state.tasks : state.tab === "sessions"
        ? state.runThreads : [];
      const query = state.query.trim().toLowerCase();
      if (!query) return rows;
      return rows.filter((row) => JSON.stringify(row).toLowerCase().includes(query));
    }

    function renderNotification() {
      const notifications = state.notifications.filter((item) => !item.runId || !state.runId || item.runId === state.runId);
      const priority = { policy_blocked: 4, attention_required: 3, failed: 2, completed: 1 };
      const notification = notifications.sort((a, b) => (priority[b.kind] ?? 0) - (priority[a.kind] ?? 0) || String(b.createdAt).localeCompare(String(a.createdAt)))[0] ?? null;
      const banner = el("notification-banner");
      banner.className = `notification-banner${notification ? ` visible ${notification.kind}` : ""}`;
      el("notification-kind").textContent = notification ? notificationLabels[notification.kind] ?? notification.kind : "";
      el("notification-title").textContent = notification?.title ?? "";
      el("notification-body").textContent = notification?.body ?? "";
    }

    function renderRunResult() {
      const result = state.run?.result;
      el("search").style.display = "none";
      el("count").textContent = result ? `검증 ${result.validationCount ?? 0}개` : "결과 대기 중";
      if (!result) {
        el("list").innerHTML = '<div class="empty">결과 대기 중</div>';
        return;
      }
      const artifacts = result.artifacts ?? [];
      const risks = result.unresolvedRisks ?? [];
      el("list").innerHTML = `<div class="result-view">
        <section class="result-hero"><h2>${escapeHtml(statusLabel(result.status))}</h2><p>${escapeHtml(result.summary || "종합 결과가 기록되지 않았습니다.")}</p></section>
        <div class="result-grid">
          <section class="result-card"><strong>산출물</strong>${artifacts.length ? `<ul>${artifacts.slice(0, 8).map((item) => `<li>${escapeHtml(item.path || item.commit || item.taskId || JSON.stringify(item))}</li>`).join("")}</ul>` : '<div class="meta">기록된 산출물이 없습니다.</div>'}</section>
          <section class="result-card"><strong>검증</strong><div class="meta">${escapeHtml(result.validationCount ?? 0)}개 검증 기록 · 종합 ${escapeHtml(result.synthesisStatus || "미적용")}</div></section>
          <section class="result-card"><strong>남은 위험</strong>${risks.length ? `<ul>${risks.slice(0, 8).map((risk) => `<li>${escapeHtml(typeof risk === "string" ? risk : JSON.stringify(risk))}</li>`).join("")}</ul>` : '<div class="meta">기록된 위험이 없습니다.</div>'}</section>
        </div>
      </div>`;
    }

    function renderAdvancedDiagnostics() {
      const taskContracts = state.tasks.filter((task) => task.executionContract);
      const events = state.events.filter((event) => !state.runId || event.entityId === state.runId || state.tasks.some((task) => task.id === event.entityId)).slice(0, 30);
      const contextSnapshot = state.contextSnapshotDetail ?? state.run?.contextSnapshot ?? null;
      el("diagnostics-content").innerHTML = `<section class="diagnostic-block"><h3>실행 identity</h3><pre>${escapeHtml(JSON.stringify({ runId: state.runId, cwd: state.cwd, scheduler: state.run?.schedulerIdentity, orchestrator: state.run?.orchestratorSessionIdentity }, null, 2))}</pre></section>
        <section class="diagnostic-block"><h3>Global Run</h3><pre>${escapeHtml(JSON.stringify(state.run?.globalRun ?? { status: "standalone_project_run" }, null, 2))}</pre></section>
        <section class="diagnostic-block"><h3>Context Snapshot</h3><pre>${escapeHtml(JSON.stringify(contextSnapshot ?? { status: "not_recorded" }, null, 2))}</pre></section>
        <section class="diagnostic-block"><h3>실행 계약 ${taskContracts.length}개</h3><pre>${escapeHtml(JSON.stringify(taskContracts.map((task) => ({ taskId: task.id, status: task.status, contract: task.executionContract, failure: task.failure })), null, 2))}</pre></section>
        <section class="diagnostic-block"><h3>Turn Dispatch ${state.turnDispatches.length}개</h3><pre>${escapeHtml(JSON.stringify(state.turnDispatches, null, 2))}</pre></section>
        <section class="diagnostic-block"><h3>최근 내부 이벤트 ${events.length}개</h3><pre>${escapeHtml(JSON.stringify(events, null, 2))}</pre></section>`;
    }

    async function loadContextSnapshotDiagnostics() {
      const snapshotId = state.run?.contextSnapshot?.id;
      if (!snapshotId || state.contextSnapshotDetail?.id === snapshotId) return;
      const payload = standalone
        ? await fetch(`/api/details/context_snapshot/${encodeURIComponent(snapshotId)}?${pageParams.toString()}`).then(async (response) => { if (!response.ok) throw new Error((await response.json()).error); return response.json(); })
        : await callTool("get_dashboard_detail", { dashboardLeaseToken: state.dashboardLeaseToken, entityType: "context_snapshot", entityId: snapshotId });
      state.contextSnapshotDetail = payload.detail;
    }

    function renderWorkList() {
      const runs = state.runs.slice(0, 12);
      el("history-count").textContent = String(state.runs.length);
      if (!runs.length) {
        el("run-lanes").innerHTML = '<div class="meta">실행 없음</div>';
        return;
      }
      el("run-lanes").innerHTML = runs.map((run) => {
        const stage = dispatchStage(run.status);
        const terminal = ["completed", "failed", "cancelled", "canceled"].includes(run.status);
        const path = run.dispatchPath === "orchestrated" ? "오케스트레이터 경유" : run.dispatchPath === "direct" ? "작업 에이전트에 바로 전달" : ["accepted", "planning", "preparing"].includes(run.status) ? "실행 경로 결정 중" : "기존 실행";
        const track = [0, 1, 2, 3].map((index) => `<span class="${terminal || index < stage ? "done" : index === stage ? "current" : ""}"></span>`).join("");
        const participants = run.executionParticipants ?? {};
        const orchestratorName = participants.orchestrator?.name || (participants.orchestrator?.id ? `스레드 ${shortId(participants.orchestrator.id)}` : null);
        const workers = participants.dataAgents ?? [];
        const workerNames = workers.slice(0, 2).map((agent) => agent.name || agent.role || `스레드 ${shortId(agent.id)}`).join(" · ");
        const workerSuffix = workers.length > 2 ? ` 외 ${workers.length - 2}개` : "";
        const actorLine = `<div class="run-card-actors"><span>${orchestratorName ? `조정 · ${escapeHtml(orchestratorName)}` : run.dispatchPath === "direct" ? "조정 · 직접 실행" : "조정 스레드 준비 중"}</span><span>${workers.length ? `작업 · ${escapeHtml(workerNames)}${escapeHtml(workerSuffix)}` : "작업 에이전트 배정 전"}</span></div>`;
        return `<button class="run-card ${run.id === state.runId ? "selected" : ""}" data-run-id="${escapeHtml(run.id)}" aria-pressed="${run.id === state.runId}"><div class="run-card-top"><span class="run-card-name">${escapeHtml(run.name || `실행 ${shortId(run.id)}`)}</span></div><div class="run-card-meta"><span class="run-status-badge">${escapeHtml(statusLabel(run.status))}</span></div><div class="run-card-path">${escapeHtml(path)} · ${date(run.updatedAt || run.createdAt)}</div>${actorLine}<div class="run-card-progress"><div class="dispatch-track" aria-label="접수, 계획, 준비, 실행">${track}</div><small>${Math.min(100, stage * 25)}%</small></div></button>`;
      }).join("");
      [...document.querySelectorAll(".run-card")].forEach((card) => card.addEventListener("click", async () => {
        if (card.dataset.runId === state.runId) return;
        state.runId = card.dataset.runId;
        state.run = null;
        state.graph = null;
        state.revision = 0;
        state.tab = "graph";
        document.querySelectorAll(".tab").forEach((item) => item.classList.toggle("active", item.dataset.tab === "graph"));
        pageParams.set("runId", state.runId);
        if (standalone) history.replaceState(null, "", `${location.pathname}?${pageParams.toString()}`);
        await refresh();
        el("inspector").open = true;
        el("inspector").scrollIntoView({ behavior: "smooth", block: "start" });
        if (standalone) connectEventStream();
      }));
    }

    function renderRunGraph() {
      const graph = state.graph;
      el("search").style.display = "none";
      if (!graph?.nodes?.length) {
        if (graph?.run) {
          const phase = statusLabel(graph.run.status);
          const failed = graph.run.status === "failed";
          const failure = graph.run.failure;
          el("count").textContent = `백그라운드 실행 준비 · ${phase}`;
          const preparingProgress = failed ? 0 : Math.min(92, dispatchStage(graph.run.status) * 28 + 8);
          const failurePanel = failed ? `<section class="plane-map-wrap"><div class="plane-map-head"><div><div class="plane-map-title">${escapeHtml(failure?.stage === "planning" ? "계획 계약 검증 실패" : "실행 준비 실패")}</div><div class="plane-map-caption">작업 스레드를 만들기 전에 안전하게 중단했습니다.</div></div><span class="pill">실패</span></div><div class="detail-item"><span>원인</span><strong>${escapeHtml(failure?.cause || "실패 원인이 기록되지 않았습니다.")}</strong></div><div class="attention-bar needs-action"><span>${escapeHtml(failureActionLabel(failure?.nextAction || "repair_contract"))}</span><span>워커 생성 0개</span></div></section>` : `<section class="plane-map-wrap"><div class="plane-map-head"><div><div class="plane-map-title">백그라운드 실행 준비</div><div class="plane-map-caption">데몬이 실행 순서와 작업 스레드를 준비하고 있습니다.</div></div><span class="pill">${escapeHtml(phase)}</span></div><div class="plane-map"><div class="plane-step control"><div class="plane-number">1</div><div><div class="plane-kicker">CONTROL PLANE</div><div class="plane-name">요청 접수 완료</div><div class="plane-help">실행 ID 발급 · 경로 결정 · 중앙 계획</div></div><span class="plane-state">접수 가능</span></div><div class="plane-connector"><strong>→</strong><span>계획 전달</span></div><div class="plane-step scheduler"><div class="plane-number">2</div><div><div class="plane-kicker">DAEMON SCHEDULER</div><div class="plane-name">영속 큐와 실행 잠금 관리</div><div class="plane-help">작업 순서 · claim · fencing · 재시도 상태를 관리하는 데몬입니다.</div></div><span class="plane-state">Codex 채팅 아님</span></div><div class="plane-connector"><strong>→</strong><span>스레드 준비</span></div><div class="plane-step orchestrator"><div class="plane-number">3</div><div><div class="plane-kicker">ORCHESTRATOR CODEX THREAD</div><div class="plane-name">실제 조정 스레드 준비 중</div><div class="plane-help">복합 실행에서 작업 분해와 결과 종합을 수행하는 별도 Codex 스레드입니다.</div></div><span class="plane-state">준비 중</span></div><div class="plane-connector"><strong>→</strong><span>작업 배정</span></div><div class="plane-step data"><div class="plane-number">4</div><div><div class="plane-kicker">DATA PLANE</div><div class="plane-name">에이전트 배정 대기</div><div class="plane-help">전문 Codex 스레드가 실제 작업을 수행합니다.</div></div><span class="plane-state">배정 대기</span></div></div></section>`;
          el("list").innerHTML = `<div class="graph-view"><div class="graph-summary"><div class="graph-summary-title"><strong>${escapeHtml(graph.run.name || "접수된 요청")}</strong><small>${escapeHtml(phase)}</small></div><div class="stage-line"><span class="current">접수</span>→<span>계획</span>→<span>구성</span>→<span>실행</span></div>${graph.run.objective ? `<div class="graph-objective">${escapeHtml(graph.run.objective)}</div>` : ""}<div class="graph-progress-row"><div class="graph-progress"><span style="width:${preparingProgress}%"></span></div><strong>${preparingProgress}%</strong></div></div>${failurePanel}</div>`;
        } else {
          el("count").textContent = "작업 흐름 없음";
          el("list").innerHTML = '<div class="empty">아직 표시할 실행이 없습니다.<br>컨트롤 플레인 채팅에 작업을 입력하면 바로 접수됩니다.</div>';
        }
        return;
      }
      const nodesById = new Map(graph.nodes.map((node) => [node.id, node]));
      const memo = new Map();
      const levelOf = (node, visiting = new Set()) => {
        if (memo.has(node.id)) return memo.get(node.id);
        if (visiting.has(node.id)) return 0;
        const next = new Set(visiting).add(node.id);
        const dependencies = (node.dependsOn || node.dependencies || []).map((id) => nodesById.get(id)).filter(Boolean);
        const level = dependencies.length ? Math.max(...dependencies.map((parent) => levelOf(parent, next))) + 1 : 0;
        memo.set(node.id, level);
        return level;
      };
      const columns = [];
      for (const node of graph.nodes) {
        const level = levelOf(node);
        (columns[level] ||= []).push(node);
      }
      const renderNode = (node) => {
        const active = ["running", "agent_done", "validating", "integration_pending"].includes(node.status);
        const workspace = node.workspace?.mode === "worktree" ? `Worktree · ${node.workspace.branch || "격리됨"}` : "공유 작업 공간";
        const verdict = node.validation?.decision === "accept" ? "검증 통과" : node.validation?.decision === "reject" ? `기준 미충족 ${node.validation.unmetCriteria?.length || 0}` : node.failureSummary?.nextAction ? failureActionLabel(node.failureSummary.nextAction) : null;
        const dependencies = (node.dependsOn || node.dependencies || []).map((id) => nodesById.get(id)?.title || shortId(id));
        const fullAgentName = node.agent?.name || "";
        const agentLabel = fullAgentName.match(/^\[[^\]]+\]/)?.[0] || fullAgentName || `역할 · ${node.role || "일반"}`;
        return `<button class="graph-node ${escapeHtml(node.status)}" data-node-id="${escapeHtml(node.id)}" aria-label="${escapeHtml(node.title)} · ${escapeHtml(statusLabel(node.status))}">
          <div class="graph-node-head"><span class="graph-node-title">${escapeHtml(node.title)}</span><span class="graph-node-status">${escapeHtml(statusLabel(node.status))}</span></div>
          <div class="graph-node-agent">담당 · ${escapeHtml(agentLabel)}</div>
          <div class="graph-node-dependencies">${dependencies.length ? `선행 작업 · ${escapeHtml(dependencies.join(" · "))}` : "선행 작업 없음 · 바로 시작 가능"}</div>
          ${active ? '<div class="graph-node-pulse"></div>' : ''}
          <div class="graph-node-foot"><span>${escapeHtml(workspace)}</span><strong>${node.resultSession?.threadId ? "선택하여 스레드 열기" : escapeHtml(verdict || `시도 ${node.attempt || 0}/${node.maxAttempts || 1}`)}</strong></div>
        </button>`;
      };
      const dependencyFlow = columns.map((column, level) => `${level ? '<div class="dependency-connector"><strong>↓</strong><span>선행 단계 완료 후 시작</span></div>' : ""}<section class="dependency-level"><div class="dependency-level-head"><strong>단계 ${level + 1}</strong><span>${column.length > 1 ? `${column.length}개 작업 병렬 실행` : "1개 작업"}</span></div><div class="dependency-grid">${column.map(renderNode).join("")}</div></section>`).join("");
      const stage = runStage(graph.run.status);
      const stages = ["준비", "실행", "검증", "완료"].map((label, index) => `<span class="${index === stage ? "current" : ""}">${index < stage ? "✓ " : ""}${label}</span>${index < 3 ? "→" : ""}`).join("");
      const orchestrated = graph.run.dispatchPath === "orchestrated";
      const orchestrator = graph.run.orchestrator;
      const scheduler = graph.run.scheduler;
      const orchestratorSession = graph.run.orchestratorSession;
      const complexity = graph.run.complexity;
      const computedProgress = Number.isFinite(Number(graph.summary.progress))
        ? Number(graph.summary.progress)
        : graph.summary.total ? Math.round(((graph.summary.finished ?? graph.summary.completed ?? 0) / graph.summary.total) * 100) : 0;
      const progress = Math.max(0, Math.min(100, computedProgress));
      const attention = graph.nodes.filter((node) => ["blocked_by_policy", "integration_blocked", "completed_with_warnings", "rejected", "validation_failed", "failed", "interrupted"].includes(node.status)).length;
      const planeFlow = `<section class="plane-map-wrap" aria-label="Control Plane, Daemon Scheduler, Orchestrator Codex thread, Data Plane execution structure">
        <div class="plane-map-head"><div><div class="plane-map-title">실행 구조와 실제 identity</div><div class="plane-map-caption">Daemon Scheduler는 영속 큐를 관리하는 프로세스이고, Orchestrator는 필요할 때 생성되는 실제 Codex 스레드입니다.</div></div><span class="pill">${orchestrated ? "오케스트레이터 경유" : "작업 에이전트에 바로 전달"}</span></div>
        <div class="plane-map">
          <div class="plane-step control"><div class="plane-number">1</div><div><div class="plane-kicker">CONTROL PLANE</div><div class="plane-name">요청 판단과 위임</div><div class="plane-help">작업 규모 산정 · 실행 경로 선택 · 전역 맥락 관리</div></div><span class="plane-state">위임 완료</span></div>
          <div class="plane-connector"><strong>→</strong><span>영속 큐 전달</span></div>
          <div class="plane-step scheduler"><div class="plane-number">2</div><div><div class="plane-kicker">DAEMON SCHEDULER</div><div class="plane-name">큐 · claim · fencing 관리</div><div class="plane-help">Codex 채팅이 아니라 재시작 복구와 bounded retry/rework를 관리하는 데몬 실행자입니다.</div></div><span class="plane-state">${escapeHtml(scheduler?.instanceId ? `daemon ${shortId(scheduler.instanceId)}` : "identity 미기록")}</span></div>
          <div class="plane-connector"><strong>→</strong><span>${orchestrated ? "조정 스레드 배정" : "직접 배정"}</span></div>
          <div class="plane-step orchestrator"><div class="plane-number">3</div><div><div class="plane-kicker">ORCHESTRATOR CODEX THREAD</div><div class="plane-name">${orchestrated ? escapeHtml(orchestrator?.name || "실행 조정 스레드") : "단순 실행: 별도 스레드 없음"}</div><div class="plane-help">${orchestrated ? "실제 Codex 스레드가 작업 분해 · 병렬 배치 · 결과 종합을 담당합니다." : "Daemon Scheduler가 Data Plane 작업을 직접 배정합니다."}</div></div>${orchestratorSession?.agentId ? threadLink(orchestratorSession.agentId, `오케스트레이터 스레드 ${isTerminalStatus(graph.run.status) ? "열기" : "보기"}`, { readOnly: !isTerminalStatus(graph.run.status) }) : '<span class="plane-state">생성되지 않음</span>'}</div>
          <div class="plane-connector"><strong>→</strong><span>작업 배정</span></div>
          <div class="plane-step data"><div class="plane-number">4</div><div><div class="plane-kicker">DATA PLANE</div><div class="plane-name">작업 에이전트 ${escapeHtml(graph.nodes.length)}개</div><div class="plane-help">전문화된 Codex 스레드가 실제 작업과 검증을 수행합니다.</div></div><span class="plane-state">${escapeHtml(graph.summary.active || 0)}개 진행 · ${escapeHtml(graph.summary.waiting || 0)}개 대기</span></div>
        </div>
      </section><div class="attention-bar ${attention ? "needs-action" : ""}"><span>${attention ? `확인이 필요한 작업이 ${attention}개 있습니다.` : graph.run.status === "completed" ? "모든 작업이 완료되었습니다." : "그래프 준비 후 사용자 확인 없이 자동으로 진행합니다."}</span>${complexity ? `<span>복잡도 ${escapeHtml(complexity.level)} · ${escapeHtml(complexity.score)}/100</span>` : `<span>${orchestrated ? "오케스트레이터 경유" : "바로 전달"}</span>`}</div>`;
      el("count").textContent = `전체 ${graph.summary.total}개 중 ${graph.summary.finished ?? graph.summary.completed}개 종료 · ${graph.summary.completed}개 완료`;
      el("list").innerHTML = `<div class="graph-view">
        <div class="graph-summary"><div class="graph-summary-title"><strong>${escapeHtml(graph.run.name || "실행 계획")}</strong><small>${escapeHtml(statusLabel(graph.run.status))}</small></div><div class="stage-line">${stages}</div>${graph.run.objective && graph.run.objective !== graph.run.name ? `<div class="graph-objective">${escapeHtml(graph.run.objective)}</div>` : ""}<div class="graph-progress-row"><div class="graph-progress"><span style="width:${progress}%"></span></div><strong>${progress}%</strong></div></div>
        ${planeFlow}
        <div class="graph-board" aria-label="작업 의존 순서">${dependencyFlow}</div>
      </div>`;
      [...document.querySelectorAll(".graph-node")].forEach((button) => button.addEventListener("click", async () => {
        const node = nodesById.get(button.dataset.nodeId);
        if (node.resultSession?.threadId) await openAgentThread(node.resultSession.threadId);
        else await showDetail(node);
      }));
      bindAgentLinks();
    }

    function render() {
      renderWorkList();
      renderNotification();
      const graphNodes = state.graph?.nodes ?? [];
      const active = graphNodes.filter((node) => ["running", "agent_done", "validating", "integration_pending"].includes(node.status)).length;
      const approvals = graphNodes.filter((node) => ["blocked_by_policy", "integration_blocked", "completed_with_warnings", "rejected", "validation_failed", "failed", "interrupted"].includes(node.status)).length;
      const completed = graphNodes.filter((node) => node.status === "completed").length;
      el("m-agents").textContent = graphNodes.length;
      el("m-active").textContent = active;
      el("m-running").textContent = approvals;
      el("m-completed").textContent = completed;
      el("scope").textContent = state.cwd || "전체 프로젝트";
      el("archive-scope").value = state.scope;
      const run = state.run ?? state.runs.find((item) => item.id === state.runId) ?? null;
      el("runbar").classList.toggle("visible", Boolean(run));
      if (run) {
        el("run-name").textContent = run.name || `실행 ${shortId(run.id)}`;
        el("run-status-badge").textContent = statusLabel(run.status);
        const activeNode = graphNodes.find((node) => ["running", "agent_done", "validating", "integration_pending", "upgrade_pending"].includes(node.status));
        const waitingNode = graphNodes.find((node) => ["queued", "blocked", "retry_waiting", "staged"].includes(node.status));
        el("focus-now").textContent = activeNode
          ? `${activeNode.title} · ${statusLabel(activeNode.status)}`
          : waitingNode ? `${waitingNode.title} · ${statusLabel(waitingNode.status)}` : statusLabel(run.status);
        const resultSummary = run.result?.summary || null;
        el("focus-result").classList.toggle("visible", Boolean(resultSummary));
        el("focus-result-summary").textContent = resultSummary || "";
        el("cancel-run").disabled = ["completed", "failed", "cancelled"].includes(run.status);
        el("cancel-run").style.display = ["accepted", "planning", "preparing", "running"].includes(run.status) ? "inline-block" : "none";
        el("archive-run").style.display = run.archiveAllowed || run.unarchiveAllowed ? "inline-block" : "none";
        el("archive-run").textContent = run.unarchiveAllowed ? "보관 해제" : "실행 보관";
        el("archive-run").dataset.action = run.unarchiveAllowed ? "unarchive" : "archive";
      } else el("archive-run").style.display = "none";

      el("updated").textContent = `마지막 갱신 ${date(state.updatedAt)}`;
      if (state.tab === "results") {
        renderRunResult();
        return;
      }
      if (state.tab === "graph") {
        renderRunGraph();
        return;
      }
      el("search").style.display = "block";

      const rows = filteredRows();
      const labels = { sessions: "스레드", progress: "작업" };
      const unit = labels[state.tab] || state.tab;
      el("count").textContent = `${unit} ${rows.length}개`;
      if (!rows.length) {
        el("list").innerHTML = `<div class="empty">표시할 ${unit}가 없습니다.</div>`;
        return;
      }

      el("list").innerHTML = rows.map((row, index) => state.tab === "sessions" ? `
        <div class="row agent-row" data-index="${index}">
          <div><div class="name">${escapeHtml(row.name || `Codex 스레드 ${shortId(row.threadId)}`)}</div><div class="meta">${escapeHtml(row.displayRole || row.threadId)}</div></div>
          <div class="status"><span class="dot ${normalize(row.status)}"></span>${escapeHtml(statusLabel(row.status))}${row.active ? '<span class="pill">진행 중</span>' : '<span class="pill">종료됨</span>'}</div>
          <div><div class="meta">${escapeHtml(row.taskIds?.length ? `연결 작업 ${row.taskIds.map(shortId).join(" · ")}` : "Run 단계 스레드")}</div><span class="pill">${escapeHtml(row.turnId ? `Turn ${shortId(row.turnId)}` : "Turn 대기")}</span></div>
          <div class="row-actions">${threadLink(row.threadId, row.active ? "진행 스레드 보기" : "스레드 열기", { readOnly: row.active })}${row.active ? '<span class="pill">명령 입력은 데몬이 관리</span>' : ''}</div>
        </div>` : state.tab === "progress" ? `
        <div class="row" data-index="${index}">
          <div><div class="name">${escapeHtml(row.title || row.prompt || `Task ${shortId(row.id)}`)}</div><div class="meta">${escapeHtml(row.failure?.cause || row.id)}</div></div>
          <div class="status"><span class="dot ${normalize(row.status)}"></span>${escapeHtml(statusLabel(row.status))}</div>
          <div><div class="meta">Agent ${escapeHtml(shortId(row.agentId))} · ${escapeHtml(`${row.attempt || 0}/${row.maxAttempts || 1}`)}</div><span class="pill">${escapeHtml(row.failure?.nextAction ? failureActionLabel(row.failure.nextAction) : row.role || row.mode || "pending")}</span></div>
          <div class="row-actions">${row.resultSession?.threadId ? threadLink(row.resultSession.threadId, "스레드 열기", { readOnly: !row.resultSession.available }) : '<span class="meta">배정 전</span>'}</div>
        </div>` : state.tab === "plans" ? `
        <div class="row" data-index="${index}">
          <div><div class="name">${escapeHtml(row.objective)}</div><div class="meta">${escapeHtml(row.id)} · v${escapeHtml(row.version)}</div></div>
          <div class="status"><span class="dot ${normalize(row.status)}"></span>${escapeHtml(statusLabel(row.status))}</div>
          <div class="meta">${escapeHtml(row.plan?.summary || "계획 생성 중")}</div><div class="meta">${date(row.updatedAt)}</div>
        </div>` : state.tab === "worktrees" ? `
        <div class="row" data-index="${index}">
          <div><div class="name">${escapeHtml(row.branch || row.id)}</div><div class="meta">${escapeHtml(row.path)}</div></div>
          <div class="status"><span class="dot ${normalize(row.status)}"></span>${escapeHtml(row.status)}</div>
          <div>${!["removed", "creating"].includes(row.status) ? `<button class="button cleanup" data-id="${escapeHtml(row.id)}">안전하게 정리</button>` : ""}</div><div class="meta">${date(row.updatedAt)}</div>
        </div>` : state.tab === "roles" ? `
        <div class="row" data-index="${index}">
          <div><div class="name">${escapeHtml(row.name)}</div><div class="meta">${escapeHtml(row.description)}</div></div>
          <div><span class="pill">${escapeHtml(row.sandbox)}</span></div>
          <div class="meta">${escapeHtml((row.capabilities || []).join(", "))}</div><div class="meta">${escapeHtml(row.model || row.approvalPolicy)}</div>
        </div>` : state.tab === "memories" ? `
        <div class="row" data-index="${index}">
          <div><div class="name">${escapeHtml(row.title || row.id)}</div><div class="meta">${escapeHtml(row.content)}</div></div>
          <div><span class="pill">${escapeHtml(row.kind)}</span></div>
          <div><div class="meta">${escapeHtml(row.cwd || "경로 없음")}</div><span class="pill">${escapeHtml((row.tags || []).join(", ") || row.source)}</span></div>
          <div class="meta">${date(row.updatedAt)}</div>
        </div>` : `
        <div class="row" data-index="${index}">
          <div><div class="name">${escapeHtml(row.eventType)}</div><div class="meta">${escapeHtml(row.entityId || "system")}</div></div>
          <div><span class="pill">${escapeHtml(row.entityType)}</span></div>
          <div class="meta">${escapeHtml(JSON.stringify(row.payload || {}))}</div>
          <div class="meta">${date(row.createdAt)}</div>
        </div>`).join("");

      [...document.querySelectorAll(".row")].forEach((element) => element.addEventListener("click", async () => {
        const row = rows[Number(element.dataset.index)];
        if (state.tab === "sessions" && row.threadId) await openAgentThread(row.threadId);
        else if (state.tab === "progress" && row.resultSession?.threadId) await openAgentThread(row.resultSession.threadId);
        else await showDetail(row);
      }));
      bindAgentLinks();
      [...document.querySelectorAll(".register-agent")].forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        openRegisterAgent(rows[Number(button.dataset.index)]);
      }));
      [...document.querySelectorAll(".archive-agent")].forEach((button) => button.addEventListener("click", async (event) => {
        event.stopPropagation();
        button.disabled = true;
        try {
          const action = button.dataset.action;
          if (standalone) await fetch(`/api/agents/${encodeURIComponent(button.dataset.id)}/${action}?${pageParams.toString()}`, { method: "POST" }).then(async (response) => { if (!response.ok) throw new Error((await response.json()).error); });
          else await callTool(action === "archive" ? "archive_agent" : "unarchive_agent", { threadId: button.dataset.id });
          state.revision = 0;
          await refresh();
        } catch (error) { el("updated").textContent = `에이전트 보관 실패: ${error.message}`; }
        finally { button.disabled = false; }
      }));
      [...document.querySelectorAll(".cleanup")].forEach((button) => button.addEventListener("click", async (event) => {
        event.stopPropagation();
        try {
          if (standalone) await fetch(`/api/worktrees/${encodeURIComponent(button.dataset.id)}/cleanup?${pageParams.toString()}`, { method: "POST" }).then(async (response) => { if (!response.ok) throw new Error((await response.json()).error); });
          else await callTool("cleanup_worktree", { worktreeId: button.dataset.id });
          await refresh();
        } catch (error) { el("updated").textContent = `정리 실패: ${error.message}`; }
      }));
    }

    function requirementMatrixDetail(matrix) {
      if (!matrix) return '<div class="meta">요구 조건 행렬이 기록되지 않았습니다.</div>';
      const groups = [["capabilities", "Capability"], ["tools", "Tool"]];
      return `<div class="requirement-grid">${groups.flatMap(([key, label]) => (matrix[key]?.cells ?? []).map((cell) => `<div class="requirement-card"><strong>${escapeHtml(label)} · ${escapeHtml(cell.requirement)}</strong><small>${cell.satisfied ? "충족" : "누락"}</small></div>`)).join("") || '<div class="meta">요구된 capability/tool이 없습니다.</div>'}</div>`;
    }

    function taskDetail(row) {
      const criteria = row.acceptanceCriteria ?? [];
      const validation = row.validation ?? null;
      const evidence = validation?.evidence ?? [];
      const unmet = validation?.unmetCriteria ?? [];
      const failure = row.failure ?? row.failureSummary ?? row.metadata?.failure ?? null;
      const routing = row.routing ?? row.routingSummary ?? null;
      const matrix = routing?.selectedRequirementMatrix ?? routing?.assignmentRequirementMatrix ?? routing?.requirementMatrix ?? null;
      const reasons = [...(routing?.reasons ?? []), ...(routing?.blockers ?? [])];
      const budget = failure?.attemptBudget;
      const contract = row.executionContract ?? row.metadata?.executionContract ?? row.metadata?.execution?.executionContract ?? null;
      const integration = row.integration ?? row.workspace?.integration ?? row.metadata?.integration ?? null;
      const repairable = failure && ["repair_contract", "manual_intervention"].includes(failure.nextAction || failure.requestedAction) && ["rejected", "validation_failed", "failed", "interrupted", "canceled"].includes(row.status);
      const resultSession = row.resultSession ?? (row.agent?.id ? { threadId: row.agent.id, turnId: row.turnId ?? null, name: row.agent.name, role: row.agent.role, available: isTerminalStatus(row.status) } : null);
      return `<section class="detail-section"><div class="detail-grid">
        <div class="detail-item"><span>상태</span><strong>${escapeHtml(statusLabel(row.status))}</strong></div>
        <div class="detail-item"><span>담당 에이전트</span><strong>${escapeHtml(row.agent?.name || shortId(row.agentId))}</strong></div>
        <div class="detail-item"><span>역할</span><strong>${escapeHtml(row.role || "일반")}</strong></div>
        <div class="detail-item"><span>작업 공간</span><strong>${escapeHtml(row.workspace?.mode || row.metadata?.execution?.workspaceMode || "shared")}</strong></div>
      </div>${resultSession?.threadId ? `<div class="dialog-actions">${threadLink(resultSession.threadId, `작업 에이전트 스레드 ${resultSession.available ? "열기" : "보기"}`, { readOnly: !resultSession.available })}</div><div class="form-help">${resultSession.available ? "이 작업을 실제로 수행한 Codex 스레드의 대화, 명령 실행과 최종 답변을 엽니다." : "실행 중인 실제 작업 스레드를 관찰용으로 엽니다. 작업 입력은 데몬이 계속 관리합니다."}</div>` : ""}</section>
      ${contract ? `<section class="detail-section"><h3>실행 계약</h3><div class="detail-grid"><div class="detail-item"><span>작업 종류</span><strong>${escapeHtml(contract.taskKind)}</strong></div><div class="detail-item"><span>권한</span><strong>${escapeHtml(contract.sandbox)}</strong></div><div class="detail-item"><span>네트워크</span><strong>${contract.networkAccess ? "허용" : "차단"}</strong></div><div class="detail-item"><span>작업공간</span><strong>${escapeHtml(contract.workspaceMode)}</strong></div><div class="detail-item"><span>통합 방식</span><strong>${escapeHtml(contract.integrationStrategy)}</strong></div><div class="detail-item"><span>계약 ID</span><strong>${escapeHtml(contract.fingerprint)}</strong></div></div></section>` : ""}
      ${integration ? `<section class="detail-section"><h3>변경 통합</h3><div class="detail-grid"><div class="detail-item"><span>상태</span><strong>${escapeHtml(integration.status)}</strong></div><div class="detail-item"><span>산출물 commit</span><strong>${escapeHtml(integration.artifact?.commit || "변경 없음")}</strong></div></div></section>` : ""}
      <section class="detail-section"><h3>요청한 작업</h3><div>${escapeHtml(row.prompt || "—")}</div></section>
      <section class="detail-section"><h3>완료 기준</h3>${criteria.length ? `<ol class="detail-list">${criteria.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ol>` : '<div class="meta">완료 기준이 지정되지 않았습니다.</div>'}</section>
      ${failure?.category ? `<section class="detail-section"><h3>실패 범주</h3><div class="pill">${escapeHtml(failure.category)}</div><div class="form-help">product는 코드·산출물, configuration은 실행 계약, policy는 권한 경계, environment는 런타임, coordination은 스레드 소유권·lease, validation은 완료 판정을 뜻합니다.</div></section>` : ""}
      ${failure ? `<section class="detail-section"><h3>실패 판정과 다음 조치</h3><div class="detail-grid"><div class="detail-item"><span>Failure type</span><strong>${escapeHtml(failure.type || "unknown")}</strong></div><div class="detail-item"><span>원인</span><strong>${escapeHtml(failure.cause || failure.message || "원인 미기록")}</strong></div><div class="detail-item"><span>다음 조치</span><strong>${escapeHtml(failureActionLabel(failure.nextAction || failure.requestedAction))}</strong></div><div class="detail-item"><span>Attempt budget</span><strong>${budget ? `${escapeHtml(budget.used ?? 0)}/${escapeHtml(budget.max ?? "—")} · 잔여 ${escapeHtml(budget.remaining ?? "—")}` : "—"}</strong></div><div class="detail-item"><span>Retryable</span><strong>${failure.retryable ? "예" : "아니요"}</strong></div><div class="detail-item"><span>Exhausted</span><strong>${failure.exhausted ? "예 · 수동 확인 필요" : "아니요"}</strong></div></div>${repairable && contract ? `<div class="repair-grid"><label class="field"><span>실행 권한</span><select data-repair-field="sandbox"><option value="read-only" ${contract.sandbox === "read-only" ? "selected" : ""}>읽기 전용</option><option value="workspace-write" ${contract.sandbox === "workspace-write" ? "selected" : ""}>프로젝트 쓰기</option><option value="danger-full-access" ${contract.sandbox === "danger-full-access" ? "selected" : ""}>전체 접근</option></select></label><label class="field"><span>작업 공간</span><select data-repair-field="workspaceMode"><option value="shared" ${contract.workspaceMode === "shared" ? "selected" : ""}>공유 작업공간</option><option value="worktree" ${contract.workspaceMode === "worktree" ? "selected" : ""}>격리 worktree</option></select></label><label class="field"><span>통합 방식</span><select data-repair-field="integrationStrategy"><option value="none" ${contract.integrationStrategy === "none" ? "selected" : ""}>통합 없음</option><option value="patch" ${contract.integrationStrategy === "patch" ? "selected" : ""}>patch 적용</option><option value="commit" ${contract.integrationStrategy === "commit" ? "selected" : ""}>commit 통합</option></select></label><label class="repair-check"><input type="checkbox" data-repair-field="networkAccess" ${contract.networkAccess ? "checked" : ""}>네트워크 허용</label></div><div class="dialog-actions"><button class="button primary repair-task" type="button" data-task-id="${escapeHtml(row.id)}">계약 수정 후 이 작업 재실행</button></div><div class="form-help">이전 실패 기록은 보존하고 새 계약 fingerprint로 한 번 더 실행합니다. 외부 서비스 변경과 파괴적 작업은 여기서 승인할 수 없습니다.</div>` : ""}</section>` : ""}
      ${routing ? `<section class="detail-section"><h3>Routing provenance와 충족 행렬</h3><div class="detail-grid"><div class="detail-item"><span>결정</span><strong>${escapeHtml(routing.decision || "기록됨")}</strong></div><div class="detail-item"><span>결정 출처</span><strong>${escapeHtml(routing.provenance?.decisionSource || "unknown")}</strong></div><div class="detail-item"><span>Daemon Scheduler</span><strong>${escapeHtml(routing.schedulerIdentity?.instanceId || "run identity 참조")}</strong></div><div class="detail-item"><span>Orchestrator Codex thread</span><strong>${escapeHtml(routing.orchestratorSessionIdentity?.agentId || "별도 스레드 없음")}</strong></div></div>${reasons.length ? `<h3>선택 이유</h3><ul class="detail-list">${reasons.map((reason) => `<li>${escapeHtml(reason)}</li>`).join("")}</ul>` : ""}${requirementMatrixDetail(matrix)}</section>` : ""}
      ${validation ? `<section class="detail-section"><h3>검증 결과 · ${escapeHtml(statusLabel(row.status))}</h3><div>${escapeHtml(validation.summary || "검증 요약이 없습니다.")}</div>${evidence.length ? `<h3>검증 근거</h3><ul class="detail-list">${evidence.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}${unmet.length ? `<h3>미충족 기준</h3><ul class="detail-list">${unmet.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}</section>` : ""}
      ${row.output ? `<section class="detail-section"><h3>에이전트 결과</h3><pre class="detail-output">${escapeHtml(row.output)}</pre></section>` : ""}
      ${row.error ? `<section class="detail-section"><h3>확인할 문제</h3><div class="text-destructive">${escapeHtml(row.error)}</div></section>` : ""}`;
    }

    function bindTaskRepair(row) {
      const button = el("detail-content").querySelector(".repair-task");
      if (!button) return;
      button.addEventListener("click", async () => {
        const root = el("detail-content");
        const value = (name) => root.querySelector(`[data-repair-field="${name}"]`);
        const args = {
          sandbox: value("sandbox").value,
          workspaceMode: value("workspaceMode").value,
          integrationStrategy: value("integrationStrategy").value,
          networkAccess: value("networkAccess").checked,
        };
        if (!confirm("수정한 실행 계약으로 이 작업을 다시 실행할까요?")) return;
        button.disabled = true;
        try {
          if (standalone) {
            const response = await fetch(`/api/tasks/${encodeURIComponent(row.id)}/repair?${pageParams.toString()}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(args) });
            if (!response.ok) throw new Error((await response.json()).error || `HTTP ${response.status}`);
          } else await callTool("repair_task_contract", { taskId: row.id, ...args });
          el("detail").close();
          unchangedPolls = 0;
          await refresh();
        } catch (error) {
          el("updated").textContent = `계약 수정 실패: ${error.message}`;
          button.disabled = false;
        }
      });
    }

    function genericDetail(row) {
      const hidden = new Set(["metadata", "routing", "contextPack", "output", "validation"]);
      const entries = Object.entries(row).filter(([key, value]) => !hidden.has(key) && value !== null && value !== undefined && typeof value !== "object").slice(0, 12);
      return `<section class="detail-section"><div class="detail-grid">${entries.map(([key, value]) => `<div class="detail-item"><span>${escapeHtml(key)}</span><strong>${escapeHtml(value)}</strong></div>`).join("")}</div></section>`;
    }

    async function showDetail(row) {
      el("detail-title").textContent = row.title || row.name || row.prompt || row.id || "상세 정보";
      el("detail-content").innerHTML = row.acceptanceCriteria || row.validation || row.workspace ? taskDetail(row) : genericDetail(row);
      bindTaskRepair(row);
      el("detail").showModal();
      if (!row.id) return;
      const types = { sessions: "agent", progress: "task", graph: "task" };
      const entityType = types[state.tab];
      if (!entityType) return;
      try {
        const payload = standalone
          ? await fetch(`/api/details/${entityType}/${encodeURIComponent(row.id)}?${pageParams.toString()}`).then(async (response) => { if (!response.ok) throw new Error((await response.json()).error); return response.json(); })
          : await callTool("get_dashboard_detail", { dashboardLeaseToken: state.dashboardLeaseToken, entityType, entityId: row.id });
        const detail = payload.detail;
        el("detail-content").innerHTML = entityType === "task" ? taskDetail(detail) : genericDetail(detail);
        if (entityType === "task") bindTaskRepair(detail);
      } catch (error) { el("detail-content").innerHTML = `<div class="text-destructive">${escapeHtml(error.message)}</div>`; }
    }

    let registeringAgent = null;
    function openRegisterAgent(agent) {
      registeringAgent = agent;
      el("register-name").textContent = agent.name || `Agent ${shortId(agent.id)}`;
      el("register-id").textContent = agent.id;
      el("register-role").value = agent.role || "";
      el("register-capabilities").value = (agent.capabilities || []).join(", ");
      el("register-summary").value = agent.summary || "";
      el("register-agent").showModal();
      setTimeout(() => el("register-role").focus(), 0);
    }

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;
      if (message.id !== undefined && pending.has(message.id)) {
        const handler = pending.get(message.id);
        pending.delete(message.id);
        if (message.error) handler.reject(new Error(message.error.message || "Bridge request failed"));
        else handler.resolve(message.result);
        return;
      }
      if (message.method === "ui/notifications/tool-input") {
        const input = message.params?.arguments ?? message.params ?? {};
        if (input.cwd && !state.cwd) state.cwd = input.cwd;
        if (input.runId && !state.runId) state.runId = input.runId;
        if (input.scope) state.scope = input.scope;
      }
      if (message.method === "ui/notifications/tool-result") applySnapshot(message.params?.structuredContent ?? {});
    }, { passive: true });

    document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => {
      state.tab = tab.dataset.tab;
      document.querySelectorAll(".tab").forEach((item) => item.classList.toggle("active", item === tab));
      render();
    }));
    el("search").addEventListener("input", (event) => { state.query = event.target.value; render(); });
    el("archive-scope").addEventListener("change", async (event) => {
      state.scope = event.target.value;
      state.runId = null;
      state.revision = 0;
      pageParams.set("scope", state.scope);
      pageParams.delete("runId");
      if (standalone) history.replaceState(null, "", `${location.pathname}?${pageParams.toString()}`);
      await refresh();
      if (standalone) connectEventStream();
    });
    el("refresh").addEventListener("click", async () => {
      unchangedPolls = 0;
      await refresh();
      scheduleEmbeddedPoll();
    });
    el("open-inspector").addEventListener("click", () => {
      el("inspector").open = true;
      el("inspector").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    el("open-diagnostics").addEventListener("click", async () => {
      renderAdvancedDiagnostics();
      el("diagnostics").showModal();
      try {
        await loadContextSnapshotDiagnostics();
        renderAdvancedDiagnostics();
      } catch (error) {
        el("updated").textContent = `Context Snapshot 진단 로드 실패: ${error.message}`;
      }
    });
    el("diagnostics-close").addEventListener("click", () => el("diagnostics").close());
    el("cancel-run").addEventListener("click", async () => {
      if (!state.runId || !confirm("이 실행과 남은 작업을 취소할까요?")) return;
      try {
        if (standalone) {
          const response = await fetch(`/api/runs/${encodeURIComponent(state.runId)}/cancel?${pageParams.toString()}`, { method: "POST" });
          if (!response.ok) throw new Error((await response.json()).error || `HTTP ${response.status}`);
        } else await callTool("cancel_run", { runId: state.runId });
        await refresh();
      } catch (error) { el("updated").textContent = `취소 실패: ${error.message}`; }
    });
    el("archive-run").addEventListener("click", async () => {
      if (!state.runId) return;
      const action = el("archive-run").dataset.action;
      el("archive-run").disabled = true;
      try {
        if (standalone) {
          const response = await fetch(`/api/runs/${encodeURIComponent(state.runId)}/${action}?${pageParams.toString()}`, { method: "POST" });
          if (!response.ok) throw new Error((await response.json()).error || `HTTP ${response.status}`);
        } else await callTool(action === "archive" ? "archive_run" : "unarchive_run", { runId: state.runId });
        state.runId = null;
        state.revision = 0;
        pageParams.delete("runId");
        if (standalone) history.replaceState(null, "", `${location.pathname}?${pageParams.toString()}`);
        await refresh();
        if (standalone) connectEventStream();
      } catch (error) { el("updated").textContent = `실행 보관 실패: ${error.message}`; }
      finally { el("archive-run").disabled = false; }
    });
    el("close").addEventListener("click", () => el("detail").close());
    el("register-close").addEventListener("click", () => el("register-agent").close());
    el("register-cancel").addEventListener("click", () => el("register-agent").close());
    el("register-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!registeringAgent) return;
      const submit = el("register-submit");
      const profile = {
        role: el("register-role").value.trim(),
        capabilities: el("register-capabilities").value.split(",").map((value) => value.trim()).filter(Boolean),
        summary: el("register-summary").value.trim(),
      };
      submit.disabled = true;
      try {
        if (standalone) {
          const response = await fetch(`/api/agents/${encodeURIComponent(registeringAgent.id)}/profile?${pageParams.toString()}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(profile) });
          if (!response.ok) throw new Error((await response.json()).error || `HTTP ${response.status}`);
        } else await callTool("register_agent_profile", { threadId: registeringAgent.id, ...profile });
        el("register-agent").close();
        await refresh();
      } catch (error) { el("updated").textContent = `에이전트 등록 실패: ${error.message}`; }
      finally { submit.disabled = false; }
    });
    const compatibilityOutput = openaiBridge?.toolOutput?.structuredContent ?? openaiBridge?.toolOutput ?? null;
    if (!standalone && compatibilityOutput && typeof compatibilityOutput === "object") applySnapshot(compatibilityOutput);

    if (standalone) {
      refresh().catch((error) => { el("updated").textContent = error.message; });
      connectEventStream();
    } else {
      if (state.dashboardLeaseToken) {
        refresh().then(scheduleEmbeddedPoll).catch((error) => { el("updated").textContent = error.message; });
      } else {
        el("updated").textContent = "Codex에서 대시보드 상태를 연결하는 중…";
        setTimeout(() => {
          const delayed = openaiBridge?.toolOutput?.structuredContent ?? openaiBridge?.toolOutput ?? null;
          if (delayed && typeof delayed === "object") applySnapshot(delayed);
          if (state.dashboardLeaseToken) void refresh().then(scheduleEmbeddedPoll);
          else el("updated").textContent = "내장 UI 연결을 받지 못했습니다. Control Plane에서 대시보드를 다시 여세요.";
        }, 1_500);
      }
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          pageActive = false;
          lifecycleGeneration += 1;
          clearTimeout(pollTimer);
          pollTimer = null;
        } else {
          pageActive = true;
          lifecycleGeneration += 1;
          unchangedPolls = 0;
          void refresh().then(scheduleEmbeddedPoll);
        }
      });
      window.addEventListener("pagehide", () => {
        pageActive = false;
        lifecycleGeneration += 1;
        clearTimeout(pollTimer);
        pollTimer = null;
      }, { once: true });
    }
  </script>
</body>
</html>
