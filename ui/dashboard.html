<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-2: #eef0f4;
      --line: rgba(15, 23, 42, 0.10);
      --text: #172033;
      --muted: #697386;
      --accent: #5b5bd6;
      --accent-soft: rgba(91, 91, 214, 0.11);
      --green: #0e9f6e;
      --amber: #d97706;
      --red: #dc2626;
      --shadow: 0 16px 38px rgba(23, 32, 51, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --surface: rgba(30, 33, 41, 0.92);
        --surface-2: #252933;
        --line: rgba(255, 255, 255, 0.09);
        --text: #f1f3f7;
        --muted: #a1a8b5;
        --accent: #9b9bf5;
        --accent-soft: rgba(155, 155, 245, 0.13);
        --green: #35c994;
        --amber: #f0a436;
        --red: #f76e6e;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% -20%, var(--accent-soft), transparent 38%),
        var(--bg);
      color: var(--text);
      font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    .app { width: min(1400px, 100%); margin: 0 auto; padding: 20px clamp(14px, 2.5vw, 34px); }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 2px 0; font-size: 23px; letter-spacing: -.035em; word-break:keep-all; overflow-wrap:break-word; }
    .subtitle { color: var(--muted); }
    .toolbar { display: flex; align-items: center; flex-wrap:wrap; gap: 8px; }
    .scope-filter { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; }
    .scope-filter select { border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--text); padding:7px 9px; }
    .button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 9px; padding: 7px 11px; cursor: pointer; }
    .button:hover { border-color: var(--accent); }
    .button:disabled { opacity: .55; cursor: wait; }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; font-weight: 700; }
    .button.danger { color: var(--red); }
    .secondary-section { margin-bottom:10px; border:1px solid var(--line); border-radius:13px; background:var(--surface); box-shadow:var(--shadow); overflow:hidden; }
    .secondary-section > summary { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 14px; cursor:pointer; color:var(--muted); font-size:12px; font-weight:700; list-style:none; }
    .secondary-section > summary::-webkit-details-marker { display:none; }
    .secondary-section > summary::after { content:"펼치기"; color:var(--accent); font-size:11px; font-weight:700; }
    .secondary-section[open] > summary::after { content:"접기"; }
    .secondary-section[open] > summary { border-bottom:1px solid var(--line); }
    .dispatch-board { margin-bottom:10px; padding:12px 14px; border:1px solid var(--line); border-radius:13px; background:var(--surface); box-shadow:var(--shadow); }
    .dispatch-board-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px; }
    .dispatch-board-title { font-weight:760; }
    .run-lanes { display:grid; gap:7px; max-height:330px; overflow-y:auto; overflow-x:hidden; }
    .run-card { width:100%; min-width:0; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); text-align:left; cursor:pointer; }
    .run-card:hover, .run-card.selected { border-color:var(--accent); background:var(--accent-soft); }
    .run-card-top { min-width:0; }
    .run-card-name { display:-webkit-box; min-width:0; min-height:2.7em; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; font-weight:700; line-height:1.35; word-break:keep-all; overflow-wrap:anywhere; }
    .run-card-path { min-width:0; color:var(--muted); font-size:10px; word-break:keep-all; overflow-wrap:anywhere; }
    .run-card-actors { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 10px; min-width:0; color:var(--muted); font-size:10px; }
    .run-card-actors span { min-width:0; word-break:keep-all; overflow-wrap:anywhere; }
    .run-card-meta { display:flex; align-items:center; justify-content:flex-end; gap:7px; white-space:nowrap; }
    .run-card-progress { grid-column:1 / -1; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:9px; min-width:0; }
    .run-card-progress small { color:var(--muted); font-size:10px; white-space:nowrap; }
    .dispatch-track { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:3px; width:100%; min-width:0; overflow:hidden; }
    .dispatch-track span { height:3px; border-radius:99px; background:var(--surface-2); }
    .dispatch-track span.done { background:var(--green); }
    .dispatch-track span.current { background:var(--accent); animation:graph-pulse 1.4s ease-in-out infinite alternate; }
    .runbar { display: none; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 10px; padding: 18px; border: 1px solid var(--line); background: var(--surface); border-radius: 15px; box-shadow: var(--shadow); }
    .runbar.visible { display: flex; }
    .run-main { min-width: 0; flex: 1; }
    .run-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .run-title-line { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
    .run-title-line .name { min-width:0; font-size:16px; white-space:normal; word-break:keep-all; overflow-wrap:anywhere; text-overflow:clip; }
    .run-status-badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 9px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; }
    .focus-now { margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--surface-2); }
    .focus-now-label { color:var(--muted); font-size:10px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; }
    .focus-now-value { margin-top:2px; font-weight:680; word-break:keep-all; overflow-wrap:anywhere; }
    .focus-result { display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
    .focus-result.visible { display:block; }
    .focus-result strong { display:block; margin-bottom:3px; }
    .focus-result p { display:-webkit-box; margin:0; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:4; color:var(--muted); font-size:12px; word-break:keep-all; overflow-wrap:anywhere; }
    .run-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .notification-banner { display:none; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; padding:11px 13px; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:11px; background:var(--surface); box-shadow:var(--shadow); }
    .notification-banner.visible { display:flex; }
    .notification-banner.completed { border-left-color:var(--green); }
    .notification-banner.failed { border-left-color:var(--red); }
    .notification-banner.attention_required, .notification-banner.policy_blocked { border-left-color:var(--amber); }
    .notification-kind { font-size:11px; font-weight:800; color:var(--muted); }
    .notification-title { margin-top:1px; font-weight:760; }
    .notification-body { margin-top:2px; color:var(--muted); font-size:12px; word-break:keep-all; overflow-wrap:anywhere; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
    .inspector-body { padding:10px; }
    .metric { display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 9px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { font-size: 22px; font-weight: 720; letter-spacing: -.04em; }
    .panel { border: 1px solid var(--line); background: var(--surface); border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .tabs { display: flex; gap: 4px; padding: 3px; border-radius: 9px; background: var(--surface-2); overflow-x: auto; }
    .tab { flex: 0 0 auto; border: 0; color: var(--muted); background: transparent; padding: 8px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
    .tab.active { color: var(--text); background: var(--surface); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .search { width: min(260px, 42vw); border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 9px; padding: 7px 10px; outline: none; }
    .search:focus { border-color: var(--accent); }
    .list { min-height: 0; overflow: visible; }
    .result-view { display:grid; gap:12px; padding:16px; }
    .result-hero { padding:14px; border-radius:12px; background:var(--surface-2); }
    .result-hero h2 { margin:0 0 6px; font-size:17px; word-break:keep-all; overflow-wrap:anywhere; }
    .result-hero p { margin:0; color:var(--muted); word-break:keep-all; overflow-wrap:anywhere; }
    .result-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
    .result-card { min-width:0; padding:12px; border:1px solid var(--line); border-radius:11px; background:var(--surface); }
    .result-card strong { display:block; margin-bottom:5px; font-size:12px; }
    .result-card ul { margin:0; padding-left:18px; color:var(--muted); font-size:11px; }
    .result-card .meta { white-space:normal; word-break:keep-all; overflow-wrap:anywhere; }
    .advanced-body { display:grid; gap:14px; }
    .diagnostic-block { padding:12px; border:1px solid var(--line); border-radius:11px; background:var(--surface-2); }
    .diagnostic-block h3 { margin:0 0 8px; font-size:13px; }
    .graph-view { min-height: 0; overflow: auto; overflow-x:hidden; padding: 16px; background: color-mix(in srgb, var(--bg) 72%, transparent); }
    .graph-summary { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 14px; padding:0 2px 14px; color:var(--muted); }
    .graph-summary strong { color: var(--text); font-size: 17px; }
    .graph-summary-title { min-width: 0; }
    .graph-summary-title strong { display:block; word-break:keep-all; overflow-wrap:anywhere; }
    .graph-summary-title small { display:block; margin-top:2px; color:var(--muted); font-size:11px; font-weight:400; }
    .graph-objective { grid-column:1 / -1; display:-webkit-box; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:3; color:var(--muted); font-size:12px; word-break:keep-all; overflow-wrap:anywhere; }
    .graph-progress-row { grid-column:1 / -1; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; min-width:0; }
    .stage-line { display:flex; align-items:center; gap:5px; color:var(--muted); font-size:11px; }
    .stage-line span { white-space:nowrap; }
    .stage-line .current { color:var(--accent); font-weight:700; }
    .graph-progress { width:100%; min-width:0; height:6px; overflow:hidden; border-radius:99px; background:var(--surface-2); }
    .graph-progress > span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
    .plane-map-wrap { margin-bottom:12px; padding:13px; border:1px solid var(--line); border-radius:13px; background:var(--surface); }
    .plane-map-head { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:8px 12px; margin-bottom:10px; }
    .plane-map-title { font-weight:760; }
    .plane-map-caption { color:var(--muted); font-size:11px; }
    .plane-map { display:grid; grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr) 42px minmax(0,1fr) 42px minmax(0,1fr); align-items:stretch; }
    .plane-step { position:relative; display:grid; grid-template-columns:36px minmax(0,1fr); align-content:start; align-items:center; gap:8px 10px; min-width:0; padding:12px; border:1px solid var(--line); border-left-width:4px; border-radius:11px; background:var(--bg); }
    .plane-step > div:nth-child(2) { min-width:0; }
    .plane-step.control { border-left-color:var(--accent); }
    .plane-step.scheduler { border-left-color:#64748b; }
    .plane-step.orchestrator { border-left-color:var(--amber); }
    .plane-step.data { border-left-color:var(--green); }
    .plane-number { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; color:white; background:var(--muted); font-weight:800; }
    .plane-step.control .plane-number { background:var(--accent); }
    .plane-step.scheduler .plane-number { background:#64748b; }
    .plane-step.orchestrator .plane-number { background:var(--amber); }
    .plane-step.data .plane-number { background:var(--green); }
    .plane-kicker { color:var(--muted); font-size:9px; font-weight:800; letter-spacing:.08em; word-break:keep-all; overflow-wrap:break-word; }
    .plane-name { margin-top:1px; font-weight:760; word-break:keep-all; overflow-wrap:break-word; }
    .plane-help { margin-top:2px; color:var(--muted); font-size:10px; line-height:1.45; word-break:keep-all; overflow-wrap:break-word; }
    .plane-state, .plane-step > .button-link { grid-column:2; justify-self:start; max-width:100%; padding:3px 7px; border-radius:999px; color:var(--muted); background:var(--surface-2); font-size:9px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .plane-connector { display:grid; place-items:center; align-content:center; gap:2px; color:var(--muted); }
    .plane-connector strong { color:var(--text); font-size:18px; line-height:1; }
    .plane-connector span { font-size:9px; text-align:center; }
    .attention-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; padding:8px 11px; border-radius:9px; color:var(--muted); background:var(--surface-2); font-size:11px; }
    .attention-bar.needs-action { color:var(--amber); background:color-mix(in srgb, var(--amber) 11%, var(--surface)); }
    .graph-board { display:grid; gap:0; min-width:0; border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden; }
    .dependency-level { display:grid; gap:9px; padding:12px; }
    .dependency-level + .dependency-level { border-top:1px solid var(--line); }
    .dependency-level-head { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font-size:11px; }
    .dependency-level-head strong { color:var(--text); font-size:12px; }
    .dependency-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .dependency-connector { display:flex; align-items:center; justify-content:center; gap:7px; margin:-4px 0; color:var(--muted); font-size:10px; }
    .dependency-connector strong { color:var(--accent); font-size:18px; line-height:1; }
    .graph-node { width:100%; min-width:0; min-height:0; padding:11px 12px; border:1px solid var(--line); border-left:4px solid var(--muted); border-radius:10px; background:var(--bg); color:var(--text); text-align:left; cursor:pointer; }
    .graph-node:hover { border-color: var(--accent); transform: translateY(-1px); }
    .graph-node.running, .graph-node.agent_done, .graph-node.validating { border-left-color:var(--green); }
    .graph-node.queued, .graph-node.blocked, .graph-node.staged { border-left-color:var(--amber); }
    .graph-node.completed { border-left-color:var(--accent); }
    .graph-node.completed_with_warnings { border-left-color:var(--amber); }
    .graph-node.rejected, .graph-node.validation_failed, .graph-node.failed, .graph-node.interrupted, .graph-node.canceled { border-left-color:var(--red); }
    .graph-node-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .graph-node-title { min-width:0; font-weight:700; line-height:1.35; word-break:keep-all; overflow-wrap:anywhere; }
    .graph-node-status { padding:3px 7px; border-radius:999px; color: var(--muted); background:var(--surface-2); font-size: 11px; white-space: nowrap; }
    .graph-node-agent { color:var(--muted); font-size:11px; word-break:keep-all; overflow-wrap:anywhere; }
    .graph-node-dependencies { margin-top:8px; padding:6px 8px; border-radius:7px; color:var(--muted); background:var(--surface-2); font-size:10px; word-break:keep-all; overflow-wrap:anywhere; }
    .graph-node-foot { display:flex; justify-content:space-between; flex-wrap:wrap; gap:5px 8px; margin-top:8px; color:var(--muted); font-size:10px; }
    .graph-node-pulse { width: 100%; height: 3px; margin-top: 8px; overflow: hidden; border-radius: 99px; background: var(--surface-2); }
    .graph-node-pulse::after { content: ""; display: block; width: 38%; height: 100%; background: var(--green); animation: graph-pulse 1.4s ease-in-out infinite alternate; }
    @keyframes graph-pulse { from { transform: translateX(-10%); } to { transform: translateX(190%); } }
    .row { display: grid; grid-template-columns: minmax(180px, 1.5fr) minmax(105px, .65fr) minmax(150px, 1fr) 105px; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .row.agent-row { grid-template-columns: minmax(190px, 1.35fr) minmax(100px, .55fr) minmax(160px, 1fr) minmax(210px, auto); }
    .row-actions { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:7px; min-width:0; }
    .button-link { display:inline-flex; align-items:center; justify-content:center; text-decoration:none; white-space:nowrap; }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: var(--accent-soft); }
    .name { font-weight: 680; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { display: inline-flex; align-items: center; gap: 7px; text-transform: capitalize; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.active, .dot.running, .dot.inprogress, .dot.agentdone, .dot.validating { background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 12%, transparent); }
    .dot.staged, .dot.queued, .dot.blocked, .dot.retrywaiting, .dot.waitingforlease { background: var(--amber); }
    .dot.rejected, .dot.validationfailed, .dot.failed, .dot.interrupted, .dot.canceled { background: var(--red); }
    .dot.completed, .dot.idle, .dot.available { background: var(--accent); }
    .pill { display: inline-block; width: fit-content; padding: 3px 7px; border-radius: 999px; color: var(--muted); background: var(--surface-2); font-size: 11px; }
    .empty { display: grid; place-items: center; min-height: 220px; color: var(--muted); text-align: center; padding: 30px; }
    .footer { display: flex; justify-content: space-between; padding: 9px 13px; color: var(--muted); border-top: 1px solid var(--line); font-size: 11px; }
    dialog { width: min(680px, calc(100vw - 32px)); max-height: 78vh; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); color: var(--text); box-shadow: 0 28px 80px rgba(0,0,0,.28); padding: 0; }
    dialog::backdrop { background: rgba(0,0,0,.38); backdrop-filter: blur(3px); }
    .detail-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .detail-body { padding: 18px; overflow: auto; max-height: 66vh; word-break:keep-all; overflow-wrap:anywhere; }
    .detail-section + .detail-section { margin-top:18px; padding-top:18px; border-top:1px solid var(--line); }
    .detail-section h3 { margin:0 0 8px; font-size:13px; }
    .detail-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
    .detail-item { padding:10px 12px; border-radius:10px; background:var(--surface-2); }
    .detail-item span { display:block; color:var(--muted); font-size:11px; }
    .detail-list { margin:0; padding-left:20px; }
    .requirement-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .requirement-card { min-width:0; padding:9px 10px; border-radius:9px; background:var(--surface-2); word-break:keep-all; overflow-wrap:break-word; }
    .requirement-card strong { display:block; font-size:11px; }
    .requirement-card small { color:var(--muted); }
    .detail-output { margin:0; white-space:pre-wrap; word-break:break-word; color:var(--text); font:12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .form-grid { display:grid; gap:14px; }
    .field { display:grid; gap:6px; }
    .field span { color:var(--muted); font-size:12px; }
    .field input, .field textarea, .field select { width:100%; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--text); padding:9px 10px; outline:none; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--accent); }
    .field textarea { min-height:92px; resize:vertical; }
    .repair-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px; }
    .repair-check { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .repair-check input { width:auto; }
    .form-help { color:var(--muted); font-size:12px; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
    .text-destructive { color: var(--red); }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: var(--muted); font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width: 1180px) {
      .plane-map { grid-template-columns:1fr; }
      .plane-step { min-height:0; }

    @media (max-width: 900px) {

    @media (max-width: 720px) {

    }
    @media (max-width: 520px) {
      .app { padding:8px; }

      .run-actions .button { width:100%; }
      .metric { min-width:0; }
      .panel { border-radius:12px; }
      .panel-head { padding:10px; }

      .plane-number { width:28px; height:28px; }
      .plane-state, .plane-step > .button-link { grid-column:2; }
      .attention-bar { align-items:flex-start; flex-direction:column; gap:4px; }

      .graph-node-head { align-items:flex-start; flex-wrap:wrap; }
      .graph-node-title { flex:1 1 220px; }
      .graph-node-status { flex:0 0 auto; }
      .graph-node-dependencies { display:-webkit-box; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:3; }
      .footer { align-items:flex-start; flex-direction:column; gap:2px; }
      dialog { width:calc(100vw - 16px); max-height:92vh; }
